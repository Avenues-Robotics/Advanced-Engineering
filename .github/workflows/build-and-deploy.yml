name: Build and deploy site from Notion

on:
  # The "button": Actions tab -> this workflow -> "Run workflow".
  # `python3 publish.py ... --deploy` on your computer starts it too, with
  # source "snapshot".
  workflow_dispatch:
    inputs:
      source:
        description: "notion: pull everything from Notion first. snapshot: build from the snapshot/ and nav.txt already in the repo."
        type: choice
        options: [notion, snapshot]
        default: notion

  # Uncomment to also rebuild automatically on a schedule (UTC time).
  # This is the only way the site updates itself without you clicking
  # anything - handy once you trust it, but leave it off at first so you
  # can watch a few manual runs before making it fully hands-off.
  # schedule:
  #   - cron: "0 11 * * *"   # daily at 11:00 UTC / 7:00am America/New_York (DST-aware conversion not automatic)

env:
  # The "Advanced Engineering Electives" page - paste the URL or bare ID.
  ROOT_PAGE_ID: "https://app.notion.com/p/Advanced-Engineering-Electives-384ec788f8408017aa6ee987a3e84299"
  # Optional - defaults to the root page's own title if left blank.
  SITE_TITLE: "Avenues Advanced Robotics Engineering"
  # Blank for a user/org Pages site (<username>.github.io). For a project
  # site (any other repo name), set this to "/<repo-name>".
  BASE_PATH: "/Advanced-Engineering"

permissions:
  contents: write   # to commit the refreshed snapshot/ and nav.txt after a Notion pull
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that's mid-flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull from Notion into snapshot/ (only currently-published pages)
        # Skipped in snapshot mode. A scheduled run has no inputs, so it pulls.
        if: inputs.source != 'snapshot'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python publish.py pull

      - name: Build site from snapshot/ and nav.txt
        run: python publish.py build --out site --base-path "$BASE_PATH"
        # Deployed via actions/deploy-pages below, so the generated HTML
        # never gets committed to the repo's history.

      - name: Commit the refreshed snapshot/ and nav.txt
        # Keeps the repo matching what's live, so a later snapshot deploy (or
        # a local pull) starts from it. The build also rewrites the list of
        # published-but-unlisted pages at the bottom of nav.txt.
        # A failure here (e.g. nav.txt edited mid-run) never blocks the deploy.
        continue-on-error: true
        run: |
          git add -A -- nav.txt snapshot
          if git diff --cached --quiet; then
            echo "snapshot/ and nav.txt unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pull from Notion (GitHub Action)"
          git pull --rebase
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
