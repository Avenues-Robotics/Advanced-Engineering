name: Build and deploy site from Notion

on:
  # The "button": Actions tab -> this workflow -> "Run workflow".
  workflow_dispatch: {}

  # Uncomment to also rebuild automatically on a schedule (UTC time).
  # This is the only way the site updates itself without you clicking
  # anything - handy once you trust it, but leave it off at first so you
  # can watch a few manual runs before making it fully hands-off.
  # schedule:
  #   - cron: "0 11 * * *"   # daily at 11:00 UTC / 7:00am America/New_York (DST-aware conversion not automatic)

env:
  # The "Advanced Engineering Electives" page - paste the URL or bare ID.
  ROOT_PAGE_ID: "PASTE-YOUR-ROOT-PAGE-URL-OR-ID-HERE"
  # Optional - defaults to the root page's own title if left blank.
  SITE_TITLE: ""
  # Blank for a user/org Pages site (<username>.github.io). For a project
  # site (any other repo name), set this to "/<repo-name>".
  BASE_PATH: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that's mid-flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site from Notion (only currently-published pages)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python build_site.py
        # NOTE: no --deploy flag here - that flag means "git push", which is
        # for the local-script workflow (see README). This workflow deploys
        # via actions/deploy-pages below instead, so the generated HTML
        # never gets committed to the repo's history.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
