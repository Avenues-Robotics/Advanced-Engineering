<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 222" width="732" height="222">
<rect x="0" y="0" width="732" height="222" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.5"/>

<style>
  .box-label { font-size: 13px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .box-sub { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .edge-label { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-name { font-size: 12.5px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .cls-stereo { font-size: 9.5px; font-style: italic; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-line { font-size: 10.5px; fill: #24211c; font-family: "SF Mono", Consolas, monospace; }
  .guard { font-size: 10px; fill: #a3402a; font-family: "SF Mono", Consolas, monospace; }
  .entry { font-size: 9.5px; fill: #5b564c; font-style: italic; font-family: -apple-system, sans-serif; }
  rect.node { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.opmode { fill: #f1e3d8; stroke: #a3402a; stroke-width: 1.3; }
  rect.state { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.cls { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.iface { fill: #eef2ec; stroke: #7c9473; stroke-width: 1.3; }
  line.divider { stroke: #c9bfa9; stroke-width: 1; }
  text { font-family: -apple-system, sans-serif; }
</style>

<g transform="translate(16,16)">
<defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
    </marker>
  </defs>
  <g color="#5b564c">
    <rect class="node" x="30" y="70" width="140" height="50" rx="25"></rect>
    <text x="100" y="100" text-anchor="middle" class="box-label">HOME</text>

    <rect class="node" x="280" y="70" width="140" height="50" rx="25"></rect>
    <text x="350" y="100" text-anchor="middle" class="box-label">MOVING</text>

    <rect class="node" x="530" y="70" width="140" height="50" rx="25"></rect>
    <text x="600" y="100" text-anchor="middle" class="box-label">AT_TARGET</text>

    <path d="M170,95 L280,95" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow2)"></path>
    <text x="225" y="82" text-anchor="middle" class="edge-label">setTarget(height)</text>

    <path d="M420,95 L530,95" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow2)"></path>
    <text x="475" y="82" text-anchor="middle" class="edge-label">reached target</text>

    <path d="M600,70 C600,20 350,10 350,68" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow2)"></path>
    <text x="480" y="24" text-anchor="middle" class="edge-label">setTarget(newHeight), re-target from AT_TARGET</text>
  </g>

</g>
</svg>