<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1032 392" width="1032" height="392">
<rect x="0" y="0" width="1032" height="392" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.5"/>

<style>
  .box-label { font-size: 13px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .box-sub { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .edge-label { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-name { font-size: 12.5px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .cls-stereo { font-size: 9.5px; font-style: italic; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-line { font-size: 10.5px; fill: #24211c; font-family: "SF Mono", Consolas, monospace; }
  .guard { font-size: 10px; fill: #a3402a; font-family: "SF Mono", Consolas, monospace; }
  .entry { font-size: 9.5px; fill: #5b564c; font-style: italic; font-family: -apple-system, sans-serif; }
  rect.node { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.opmode { fill: #f1e3d8; stroke: #a3402a; stroke-width: 1.3; }
  rect.state { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.cls { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.iface { fill: #eef2ec; stroke: #7c9473; stroke-width: 1.3; }
  line.divider { stroke: #c9bfa9; stroke-width: 1; }
  text { font-family: -apple-system, sans-serif; }
</style>

<g transform="translate(16,16)">
<defs>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="currentColor" stroke-width="1"></path>
    </marker>
    <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,5 L7,1 L13,5 L7,9 z" fill="currentColor"></path>
    </marker>
    <marker id="openarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="currentColor" stroke-width="1.4"></path>
    </marker>
  </defs>
  <g color="#5b564c">
    <rect class="opmode" x="405" y="10" width="190" height="44" rx="6"></rect>
    <text x="500" y="30" text-anchor="middle" class="cls-name">OpMode</text>
    <text x="500" y="44" text-anchor="middle" class="cls-stereo">creates and updates subsystems</text>

    <rect class="iface" x="415" y="94" width="170" height="66" rx="6"></rect>
    <text x="500" y="112" text-anchor="middle" class="cls-stereo">&#171;interface&#187;</text>
    <text x="500" y="128" text-anchor="middle" class="cls-name">Subsystem</text>
    <line class="divider" x1="415" y1="136" x2="585" y2="136"></line>
    <text x="425" y="152" class="cls-line">+ update(): void</text>

    <path d="M500,54 L500,94" fill="none" stroke="currentColor" stroke-width="1.4" marker-start="url(#diamond)"></path>

    <rect class="cls" x="20" y="210" width="220" height="50" rx="6"></rect>
    <text x="130" y="240" text-anchor="middle" class="cls-name">Drivetrain</text>

    <rect class="cls" x="270" y="210" width="200" height="50" rx="6"></rect>
    <text x="370" y="240" text-anchor="middle" class="cls-name">Intake</text>

    <rect class="cls" x="500" y="210" width="220" height="50" rx="6"></rect>
    <text x="610" y="240" text-anchor="middle" class="cls-name">Lift</text>

    <rect class="cls" x="750" y="210" width="200" height="50" rx="6"></rect>
    <text x="850" y="240" text-anchor="middle" class="cls-name">Outtake</text>

    <path d="M130,210 L490,160" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#tri)"></path>
    <path d="M370,210 L495,160" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#tri)"></path>
    <path d="M610,210 L505,160" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#tri)"></path>
    <path d="M850,210 L510,160" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#tri)"></path>

    <path d="M750,235 L720,235" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#openarrow)"></path>
    <text x="735" y="225" text-anchor="middle" class="edge-label" style="font-size:9px">uses</text>

    <text x="500" y="300" text-anchor="middle" class="edge-label">Outtake.release() calls Lift.atTarget() first, that boolean is the entire contract between them.</text>
  </g>

</g>
</svg>