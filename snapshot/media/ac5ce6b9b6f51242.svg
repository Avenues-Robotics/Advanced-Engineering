<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 492" width="732" height="492">
<rect x="0" y="0" width="732" height="492" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.5"/>

<style>
  .box-label { font-size: 13px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .box-sub { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .edge-label { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-name { font-size: 12.5px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .cls-stereo { font-size: 9.5px; font-style: italic; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-line { font-size: 10.5px; fill: #24211c; font-family: "SF Mono", Consolas, monospace; }
  .guard { font-size: 10px; fill: #a3402a; font-family: "SF Mono", Consolas, monospace; }
  .entry { font-size: 9.5px; fill: #5b564c; font-style: italic; font-family: -apple-system, sans-serif; }
  rect.node { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.opmode { fill: #f1e3d8; stroke: #a3402a; stroke-width: 1.3; }
  rect.state { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.cls { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.iface { fill: #eef2ec; stroke: #7c9473; stroke-width: 1.3; }
  line.divider { stroke: #c9bfa9; stroke-width: 1; }
  text { font-family: -apple-system, sans-serif; }
</style>

<g transform="translate(16,16)">
<defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
    </marker>
  </defs>
  <g color="#5b564c">
    <rect class="node" x="170" y="14" width="360" height="46" rx="8"></rect>
    <text x="350" y="34" text-anchor="middle" class="box-label">Read Inputs</text>
    <text x="350" y="50" text-anchor="middle" class="box-sub">gamepad1 + gamepad2</text>

    <rect class="node" x="170" y="82" width="360" height="46" rx="8"></rect>
    <text x="350" y="102" text-anchor="middle" class="box-label">Drivetrain</text>
    <text x="350" y="118" text-anchor="middle" class="box-sub">drive from sticks, every cycle</text>

    <rect class="node" x="170" y="150" width="360" height="46" rx="8"></rect>
    <text x="350" y="170" text-anchor="middle" class="box-label">Intake</text>
    <text x="350" y="186" text-anchor="middle" class="box-sub">trigger held: IN or OUT, else IDLE</text>

    <rect class="node" x="170" y="218" width="360" height="46" rx="8"></rect>
    <text x="350" y="238" text-anchor="middle" class="box-label">Lift</text>
    <text x="350" y="254" text-anchor="middle" class="box-sub">D-pad sets target height</text>

    <rect class="node" x="170" y="286" width="360" height="46" rx="8"></rect>
    <text x="350" y="306" text-anchor="middle" class="box-label">Outtake</text>
    <text x="350" y="322" text-anchor="middle" class="box-sub">button: grab, or release</text>

    <rect class="node" x="170" y="354" width="360" height="40" rx="8"></rect>
    <text x="350" y="378" text-anchor="middle" class="box-label" style="font-size:12.5px">Update Telemetry</text>

    <path d="M350,60 L350,82" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow4)"></path>
    <path d="M350,128 L350,150" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow4)"></path>
    <path d="M350,196 L350,218" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow4)"></path>
    <path d="M350,264 L350,286" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow4)"></path>
    <path d="M350,332 L350,354" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow4)"></path>

    <path d="M170,374 C60,374 60,37 170,37" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow4)"></path>
    <text x="40" y="205" text-anchor="middle" class="edge-label" transform="rotate(-90 40 205)">repeat, next cycle (~20 ms)</text>

    <text x="350" y="430" text-anchor="middle" class="edge-label">This chain repeats every cycle. It never ends on its own, only the driver station stopping the OpMode ends it.</text>
  </g>

</g>
</svg>