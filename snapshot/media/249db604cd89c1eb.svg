<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 332" width="792" height="332">
<rect x="0" y="0" width="792" height="332" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.5"/>

<style>
  .box-label { font-size: 13px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .box-sub { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .edge-label { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-name { font-size: 12.5px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .cls-stereo { font-size: 9.5px; font-style: italic; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-line { font-size: 10.5px; fill: #24211c; font-family: "SF Mono", Consolas, monospace; }
  .guard { font-size: 10px; fill: #a3402a; font-family: "SF Mono", Consolas, monospace; }
  .entry { font-size: 9.5px; fill: #5b564c; font-style: italic; font-family: -apple-system, sans-serif; }
  rect.node { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.opmode { fill: #f1e3d8; stroke: #a3402a; stroke-width: 1.3; }
  rect.state { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.cls { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.iface { fill: #eef2ec; stroke: #7c9473; stroke-width: 1.3; }
  line.divider { stroke: #c9bfa9; stroke-width: 1; }
  text { font-family: -apple-system, sans-serif; }
</style>

<g transform="translate(16,16)">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
    </marker>
  </defs>
  <g color="#5b564c">
    <rect class="opmode" x="290" y="20" width="180" height="46" rx="8"></rect>
    <text x="380" y="44" text-anchor="middle" class="box-label">OpMode</text>
    <text x="380" y="58" text-anchor="middle" class="box-sub">Auto / Teleop</text>

    <rect class="node" x="20" y="180" width="150" height="52" rx="8"></rect>
    <text x="95" y="203" text-anchor="middle" class="box-label">Drivetrain</text>
    <text x="95" y="218" text-anchor="middle" class="box-sub">4x mecanum motor</text>

    <rect class="node" x="205" y="180" width="150" height="52" rx="8"></rect>
    <text x="280" y="203" text-anchor="middle" class="box-label">Intake</text>
    <text x="280" y="218" text-anchor="middle" class="box-sub">roller motor</text>

    <rect class="node" x="405" y="180" width="150" height="52" rx="8"></rect>
    <text x="480" y="203" text-anchor="middle" class="box-label">Lift</text>
    <text x="480" y="218" text-anchor="middle" class="box-sub">slide motor + limit switch</text>

    <rect class="node" x="590" y="180" width="150" height="52" rx="8"></rect>
    <text x="665" y="203" text-anchor="middle" class="box-label">Outtake</text>
    <text x="665" y="218" text-anchor="middle" class="box-sub">claw servo</text>

    <path d="M320,66 L110,180" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></path>
    <path d="M350,66 L285,180" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></path>
    <path d="M410,66 L475,180" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></path>
    <path d="M440,66 L655,180" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)"></path>

    <path d="M555,206 L590,206" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"></path>
    <text x="572" y="196" text-anchor="middle" class="edge-label">atTarget()</text>

    <text x="60" y="270" class="edge-label">OpMode calls each subsystem's update() once per loop cycle.</text>
    <text x="60" y="286" class="edge-label">Outtake checks Lift.atTarget() before it releases, so it never drops a pixel mid-raise.</text>
  </g>

</g>
</svg>