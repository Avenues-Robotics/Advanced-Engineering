<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 292" width="892" height="292">
<rect x="0" y="0" width="892" height="292" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.5"/>

<style>
  .box-label { font-size: 13px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .box-sub { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .edge-label { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-name { font-size: 12.5px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .cls-stereo { font-size: 9.5px; font-style: italic; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-line { font-size: 10.5px; fill: #24211c; font-family: "SF Mono", Consolas, monospace; }
  .guard { font-size: 10px; fill: #a3402a; font-family: "SF Mono", Consolas, monospace; }
  .entry { font-size: 9.5px; fill: #5b564c; font-style: italic; font-family: -apple-system, sans-serif; }
  rect.node { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.opmode { fill: #f1e3d8; stroke: #a3402a; stroke-width: 1.3; }
  rect.state { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.cls { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.iface { fill: #eef2ec; stroke: #7c9473; stroke-width: 1.3; }
  line.divider { stroke: #c9bfa9; stroke-width: 1; }
  text { font-family: -apple-system, sans-serif; }
</style>

<g transform="translate(16,16)">
<defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
    </marker>
  </defs>
  <g color="#5b564c">
    <circle cx="420" cy="14" r="5" fill="currentColor"></circle>
    <path d="M420,19 L420,40" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a2)"></path>

    <rect class="state" x="330" y="40" width="180" height="54" rx="27"></rect>
    <text x="420" y="62" text-anchor="middle" class="cls-name">IDLE</text>
    <text x="420" y="78" text-anchor="middle" class="entry">entry / rollerMotor power 0</text>

    <rect class="state" x="110" y="190" width="200" height="54" rx="27"></rect>
    <text x="210" y="212" text-anchor="middle" class="cls-name">INTAKING</text>
    <text x="210" y="228" text-anchor="middle" class="entry">entry / rollerMotor power +1.0</text>

    <rect class="state" x="550" y="190" width="200" height="54" rx="27"></rect>
    <text x="650" y="212" text-anchor="middle" class="cls-name">REVERSING</text>
    <text x="650" y="228" text-anchor="middle" class="entry">entry / rollerMotor power -1.0</text>

    <path d="M375,94 L245,190" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a2)"></path>
    <text x="270" y="150" text-anchor="middle" class="guard">[rightTrigger]</text>

    <path d="M230,190 C270,140 340,120 385,96" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a2)"></path>
    <text x="300" y="115" text-anchor="middle" class="guard">[released]</text>

    <path d="M465,94 L595,190" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a2)"></path>
    <text x="570" y="150" text-anchor="middle" class="guard">[leftTrigger]</text>

    <path d="M610,190 C570,140 500,120 455,96" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#a2)"></path>
    <text x="540" y="115" text-anchor="middle" class="guard">[released]</text>
  </g>

</g>
</svg>