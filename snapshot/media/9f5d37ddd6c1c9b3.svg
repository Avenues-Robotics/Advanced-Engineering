<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 432" width="732" height="432">
<rect x="0" y="0" width="732" height="432" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.5"/>

<style>
  .box-label { font-size: 13px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .box-sub { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .edge-label { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-name { font-size: 12.5px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .cls-stereo { font-size: 9.5px; font-style: italic; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-line { font-size: 10.5px; fill: #24211c; font-family: "SF Mono", Consolas, monospace; }
  .guard { font-size: 10px; fill: #a3402a; font-family: "SF Mono", Consolas, monospace; }
  .entry { font-size: 9.5px; fill: #5b564c; font-style: italic; font-family: -apple-system, sans-serif; }
  rect.node { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.opmode { fill: #f1e3d8; stroke: #a3402a; stroke-width: 1.3; }
  rect.state { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.cls { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.iface { fill: #eef2ec; stroke: #7c9473; stroke-width: 1.3; }
  line.divider { stroke: #c9bfa9; stroke-width: 1; }
  text { font-family: -apple-system, sans-serif; }
</style>

<g transform="translate(16,16)">
<defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
    </marker>
  </defs>
  <g color="#5b564c">
    <rect class="node" x="240" y="10" width="220" height="42" rx="8"></rect>
    <text x="350" y="36" text-anchor="middle" class="box-label">DRIVE_TO_SPIKE</text>

    <rect class="node" x="240" y="80" width="220" height="42" rx="8"></rect>
    <text x="350" y="106" text-anchor="middle" class="box-label">DROP_PURPLE</text>

    <rect class="node" x="240" y="150" width="220" height="42" rx="8"></rect>
    <text x="350" y="176" text-anchor="middle" class="box-label">DRIVE_TO_BACKDROP</text>

    <rect class="node" x="240" y="220" width="220" height="42" rx="8"></rect>
    <text x="350" y="246" text-anchor="middle" class="box-label">RAISE_LIFT</text>

    <rect class="node" x="240" y="290" width="220" height="42" rx="8"></rect>
    <text x="350" y="316" text-anchor="middle" class="box-label">DEPOSIT_YELLOW</text>

    <rect class="node" x="240" y="360" width="220" height="30" rx="8"></rect>
    <text x="350" y="380" text-anchor="middle" class="box-label" style="font-size:12px">PARK / DONE</text>

    <path d="M350,52 L350,80" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow3)"></path>
    <text x="470" y="70" class="edge-label">drive complete</text>

    <path d="M350,122 L350,150" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow3)"></path>
    <text x="470" y="140" class="edge-label">pixel released</text>

    <path d="M350,192 L350,220" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow3)"></path>
    <text x="470" y="210" class="edge-label">drive complete</text>

    <path d="M350,262 L350,290" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow3)"></path>
    <text x="470" y="280" class="edge-label">lift.atTarget()</text>

    <path d="M350,332 L350,360" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow3)"></path>
    <text x="470" y="350" class="edge-label">pixel released</text>
  </g>

</g>
</svg>