<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 292" width="1052" height="292">
<rect x="0" y="0" width="1052" height="292" rx="12" fill="#ffffff" stroke="#d9d2c4" stroke-width="1.5"/>

<style>
  .box-label { font-size: 13px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .box-sub { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .edge-label { font-size: 10.5px; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-name { font-size: 12.5px; font-weight: 700; fill: #24211c; font-family: -apple-system, sans-serif; }
  .cls-stereo { font-size: 9.5px; font-style: italic; fill: #5b564c; font-family: -apple-system, sans-serif; }
  .cls-line { font-size: 10.5px; fill: #24211c; font-family: "SF Mono", Consolas, monospace; }
  .guard { font-size: 10px; fill: #a3402a; font-family: "SF Mono", Consolas, monospace; }
  .entry { font-size: 9.5px; fill: #5b564c; font-style: italic; font-family: -apple-system, sans-serif; }
  rect.node { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.opmode { fill: #f1e3d8; stroke: #a3402a; stroke-width: 1.3; }
  rect.state { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.cls { fill: #fffdf8; stroke: #c9bfa9; stroke-width: 1.3; }
  rect.iface { fill: #eef2ec; stroke: #7c9473; stroke-width: 1.3; }
  line.divider { stroke: #c9bfa9; stroke-width: 1; }
  text { font-family: -apple-system, sans-serif; }
</style>

<g transform="translate(16,16)">
<g color="#5b564c">
    <rect class="cls" x="20" y="20" width="240" height="196" rx="6"></rect>
    <text x="140" y="42" text-anchor="middle" class="cls-name">Drivetrain</text>
    <text x="140" y="56" text-anchor="middle" class="cls-stereo">implements Subsystem</text>
    <line class="divider" x1="20" y1="64" x2="260" y2="64"></line>
    <text x="30" y="80" class="cls-line">- motors: DcMotor[4]</text>
    <text x="30" y="96" class="cls-line">- pose: Pose</text>
    <line class="divider" x1="20" y1="104" x2="260" y2="104"></line>
    <text x="30" y="120" class="cls-line">+ Drivetrain(hw:HardwareMap)</text>
    <text x="30" y="136" class="cls-line">+ update(): void</text>
    <text x="30" y="152" class="cls-line">+ drive(fwd,strafe,turn:double)</text>
    <text x="30" y="168" class="cls-line">+ driveTo(p: Pose): void</text>
    <text x="30" y="184" class="cls-line">+ atPose(): boolean</text>

    <rect class="cls" x="280" y="20" width="220" height="160" rx="6"></rect>
    <text x="390" y="42" text-anchor="middle" class="cls-name">Intake</text>
    <text x="390" y="56" text-anchor="middle" class="cls-stereo">implements Subsystem</text>
    <line class="divider" x1="280" y1="64" x2="500" y2="64"></line>
    <text x="290" y="80" class="cls-line">- rollerMotor: DcMotor</text>
    <text x="290" y="96" class="cls-line">- state: IntakeState</text>
    <line class="divider" x1="280" y1="104" x2="500" y2="104"></line>
    <text x="290" y="120" class="cls-line">+ Intake(hw: HardwareMap)</text>
    <text x="290" y="136" class="cls-line">+ update(): void</text>
    <text x="290" y="152" class="cls-line">+ setState(s: IntakeState)</text>

    <rect class="cls" x="520" y="20" width="240" height="210" rx="6"></rect>
    <text x="640" y="42" text-anchor="middle" class="cls-name">Lift</text>
    <text x="640" y="56" text-anchor="middle" class="cls-stereo">implements Subsystem</text>
    <line class="divider" x1="520" y1="64" x2="760" y2="64"></line>
    <text x="530" y="80" class="cls-line">- slideMotor: DcMotor</text>
    <text x="530" y="96" class="cls-line">- limitSwitch: TouchSensor</text>
    <text x="530" y="112" class="cls-line">- targetHeight: int</text>
    <text x="530" y="128" class="cls-line">- state: LiftState</text>
    <line class="divider" x1="520" y1="136" x2="760" y2="136"></line>
    <text x="530" y="152" class="cls-line">+ Lift(hw: HardwareMap)</text>
    <text x="530" y="168" class="cls-line">+ update(): void</text>
    <text x="530" y="184" class="cls-line">+ setTarget(h: int)</text>
    <text x="530" y="200" class="cls-line">+ atTarget(): boolean</text>

    <rect class="cls" x="780" y="20" width="220" height="196" rx="6"></rect>
    <text x="890" y="42" text-anchor="middle" class="cls-name">Outtake</text>
    <text x="890" y="56" text-anchor="middle" class="cls-stereo">implements Subsystem</text>
    <line class="divider" x1="780" y1="64" x2="1000" y2="64"></line>
    <text x="790" y="80" class="cls-line">- clawServo: Servo</text>
    <line class="divider" x1="780" y1="88" x2="1000" y2="88"></line>
    <text x="790" y="104" class="cls-line">+ Outtake(hw: HardwareMap)</text>
    <text x="790" y="120" class="cls-line">+ update(): void</text>
    <text x="790" y="136" class="cls-line">+ grab(): void</text>
    <text x="790" y="152" class="cls-line">+ release(): void</text>
    <text x="790" y="168" class="cls-line">+ isEmpty(): boolean</text>
  </g>

</g>
</svg>